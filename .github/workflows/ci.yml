name: CI

on:
  # main is checked by deploy.yml, which runs this workflow before publishing.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the spec_version check compares against earlier commits

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Python reference engine passes the scenarios
        run: python3 reference/engine_reference.py fixtures/scenarios.json fixtures/spec-library.workbook.json

      - name: Unit tests (engine, schemas, differential against the reference)
        run: npm test

      - name: Spec library validation
        run: npm run validate:spec
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (Chromium, Firefox, iPhone SE, Android)
        run: npm run e2e

      # When called by deploy.yml for main, hand the tested build to the deploy job.
      - name: Upload the tested build for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the spec_version check compares against earlier commits

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Python reference engine passes the scenarios
        run: python3 reference/engine_reference.py fixtures/scenarios.json data/spec-library.json

      - name: Unit tests (engine, schemas, differential against the reference)
        run: npm test

      - name: Spec library validation
        run: npm run validate:spec
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (Chromium, Firefox, iPhone SE, Android)
        run: npm run e2e

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

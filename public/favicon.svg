<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>RigPoint Load Sheet</title>
  <rect width="512" height="512" rx="96" fill="#0b2545"/>
  <!-- truss -->
  <rect x="96" y="104" width="320" height="28" rx="6" fill="#f2c230"/>
  <!-- chain -->
